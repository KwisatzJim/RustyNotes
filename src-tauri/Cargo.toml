[package]
name = "rustynotes"
version = "0.1.0"
description = "Local-first Markdown notes with manual Nextcloud Notes synchronization"
authors = ["Jim Kelley"]
license = "MIT"
homepage = "https://github.com/KwisatzJim/RustyNotes"
repository = "https://github.com/KwisatzJim/RustyNotes"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rustynotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
dirs = "5"
chrono = { version = "0.4", features = ["clock"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Persistent desktop wallet storage, with encrypted D-Bus secret transfer.
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
http = "1"
